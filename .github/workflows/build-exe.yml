name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build EXE
        run: npm run dist
      - name: Attach EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
